[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-midterm"
version = "1.1.0"
description = "MNIST classification with NumPy models and scikit-learn Random Forest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "pandas==3.0.1", "matplotlib==3.11.2", "scikit-learn==1.9.1", "Pillow==13.0.0"]

[project.optional-dependencies]
reports = ["reportlab==4.4.9", "pypdf==6.10.0", "python-docx==1.2.0"]
notebooks = ["jupyter==1.1.1", "nbformat>=5.10,<6", "ipython>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
